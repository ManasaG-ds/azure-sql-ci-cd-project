parameters:
- name: environmentName
  type: string

- name: displayEnvironmentName
  type: string

- name: variableGroup
  type: string

- name: dependsOn
  type: string


stages:
- stage: Flyway_${{ parameters.environmentName }}
  displayName: "${{ parameters.displayEnvironmentName }} - Database Migration"
  dependsOn: ${{ parameters.dependsOn }}
  condition: succeeded()

  variables:
  - group: ${{ parameters.variableGroup }}

  jobs:
  - job: FlywayMigration
    displayName: "${{ parameters.displayEnvironmentName }} - Flyway Migration"
    environment: ${{ parameters.environmentName }}
    pool:
      vmImage: ubuntu-latest
      
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz -o flyway.tar.gz
              tar -xzf flyway.tar.gz
              sudo ln -s $(pwd)/flyway-9.22.0/flyway /usr/local/bin/flyway
            displayName: "Install Flyway"
      
          - script: |
              flyway -configFiles=$(Build.SourcesDirectory)/flyway/config/flyway.conf migrate
            displayName: "Run Flyway Migrations - ${{ parameters.displayEnvironmentName }}"
            env:
              FLYWAY_URL: "jdbc:sqlserver://$(DB_SERVER).database.windows.net:1433;databaseName=$(database_name);encrypt=true;trustServerCertificate=false;loginTimeout=30;"
              FLYWAY_USER: $(DB_USER)
              FLYWAY_PASSWORD: $(DB_PASSWORD)
