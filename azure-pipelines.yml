trigger: none

stages:

# -----------------------------
# STAGE 1: VALIDATE
# -----------------------------
- stage: Validate
  displayName: "Validate Terraform"
  jobs:
  - job: Validate
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: TerraformInstaller@1

    - script: rm -rf .terraform .terraform.lock.hcl
      workingDirectory: terraform
      displayName: "Clean Terraform Files"

    - script: |
        terraform init -upgrade -reconfigure \
          -backend-config="key=dev.tfstate"
      workingDirectory: terraform
      displayName: "Terraform Init"

    - script: terraform validate
      workingDirectory: terraform
      displayName: "Terraform Validate"


# -----------------------------
# DEV ENVIRONMENT
# -----------------------------
- template: templates/terraform-stage.yml
  parameters:
    environmentName: dev
    displayEnvironmentName: DEV
    variableGroup: dev-terraform-secrets
    dependsOn: Validate
    backendStateKey: dev.tfstate

- template: templates/flyway-stage.yml
  parameters:
    environmentName: dev
    displayEnvironmentName: DEV
    variableGroup: dev-terraform-secrets
    dependsOn: Terraform_dev


# -----------------------------
# TEST ENVIRONMENT
# -----------------------------
- template: templates/terraform-stage.yml
  parameters:
    environmentName: test
    displayEnvironmentName: TEST
    variableGroup: test-terraform-secrets
    dependsOn: Flyway_dev
    backendStateKey: test.tfstate

- template: templates/flyway-stage.yml
  parameters:
    environmentName: test
    displayEnvironmentName: TEST
    variableGroup: test-terraform-secrets
    dependsOn: Terraform_test
