trigger:
- main

variables:
- group: terraform-secrets   # contains ARM + DB secrets

stages:

# -----------------------------
# STAGE 1: VALIDATE
# -----------------------------
- stage: Validate
  displayName: "Validate Terraform"
  jobs:
  - job: Validate
    pool:
      vmImage: ubuntu-latest

    steps:

    - task: TerraformInstaller@1

    - script: rm -rf .terraform .terraform.lock.hcl
      workingDirectory: terraform

    - script: terraform init -upgrade -reconfigure
      workingDirectory: terraform
      displayName: "Terraform Init"

    - script: terraform validate
      workingDirectory: terraform
      displayName: "Terraform Validate"


# -----------------------------
# STAGE 2: PLAN
# -----------------------------
- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: TerraformInstaller@1

    - script: rm -rf .terraform .terraform.lock.hcl
      workingDirectory: terraform

    - script: terraform init -upgrade -reconfigure
      workingDirectory: terraform
      displayName: "Terraform Init"   
      
    - script: terraform plan -out=tfplan -input=false
      workingDirectory: terraform
      displayName: "Terraform Plan"
      env:
        TF_VAR_admin_password: $(DB_PASSWORD)
        TF_VAR_admin_user: "sqladmin"
        TF_VAR_sql_server_name: $(DB_SERVER)
        TF_VAR_resource_group_name: $(resource_group_name)
        TF_VAR_database_name: $(database_name)
        TF_VAR_ip_address: $(ip_address)


    - publish: terraform/tfplan
      artifact: tfplan


# -----------------------------
# STAGE 3: APPLY
# -----------------------------
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - job: Apply
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: TerraformInstaller@1

    - script: rm -rf .terraform .terraform.lock.hcl
      workingDirectory: terraform

    - download: current
      artifact: tfplan

    - script: terraform init -upgrade -reconfigure
      workingDirectory: terraform
      displayName: "Terraform Init"

    - script: terraform apply -auto-approve tfplan
      workingDirectory: terraform
      displayName: "Terraform Apply"


# -----------------------------
# STAGE 4: DATABASE MIGRATION
# -----------------------------
- stage: Flyway
  displayName: "Database Migration"
  dependsOn: Apply
  jobs:
  - job: FlywayMigration
    pool:
      vmImage: ubuntu-latest

    steps:
    - script: |
        curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz -o flyway.tar.gz
        tar -xzf flyway.tar.gz
        sudo ln -s $(pwd)/flyway-9.22.0/flyway /usr/local/bin/flyway
      displayName: "Install Flyway"

    - script: |
        flyway -url=jdbc:sqlserver://$(DB_SERVER).database.windows.net \
               -user=$(DB_USER) \
               -password=$(DB_PASSWORD) \
               -locations=filesystem:sql \
               migrate
      displayName: "Run Flyway Migrations"
